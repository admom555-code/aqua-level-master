<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aqua Level Master</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
}

header {
    text-align: center;
    padding: 25px 10px;
    background: #111c30;
    border-bottom: 1px solid #263653;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    color: #9fb3cc;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.card {
    background: #111c30;
    border: 1px solid #263653;
    border-radius: 15px;
    padding: 22px;
    text-align: center;
}

.card-title {
    color: #9fb3cc;
    font-size: 15px;
    margin-bottom: 12px;
}

.value {
    font-size: 35px;
    font-weight: bold;
}

.unit {
    font-size: 16px;
    color: #9fb3cc;
}

.status {
    font-size: 27px;
    font-weight: bold;
}

.on {
    color: #31e981;
}

.off {
    color: #ff5c5c;
}

.connected {
    color: #31e981;
}

.disconnected {
    color: #ff5c5c;
}

.section {
    margin-top: 20px;
    background: #111c30;
    border: 1px solid #263653;
    border-radius: 15px;
    padding: 20px;
}

.section h2 {
    margin-top: 0;
    font-size: 20px;
}

canvas {
    width: 100%;
    height: 280px;
}

.footer {
    text-align: center;
    color: #71839d;
    padding: 25px;
    font-size: 13px;
}

.error {
    color: #ff6b6b;
    text-align: center;
    margin-top: 15px;
}

@media (max-width: 500px) {
    header h1 {
        font-size: 23px;
    }

    .value {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <h1>💧 AQUA LEVEL MASTER</h1>
    <p>Remote Water Tank Monitoring System</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">WATER LEVEL</div>
            <div class="value" id="distance">--</div>
            <div class="unit">cm</div>
        </div>

        <div class="card">
            <div class="card-title">TANK LEVEL</div>
            <div class="value" id="percent">--</div>
            <div class="unit">%</div>
        </div>

        <div class="card">
            <div class="card-title">PUMP</div>
            <div class="status" id="pump">--</div>
        </div>

        <div class="card">
            <div class="card-title">LoRa</div>
            <div class="status" id="lora">--</div>
        </div>

    </div>

    <div class="section">
        <h2>📈 WATER LEVEL HISTORY</h2>
        <canvas id="chart"></canvas>
    </div>

    <div id="error" class="error"></div>

</div>

<div class="footer">
    Aqua Level Master • Automatic update every 20 seconds
</div>

<script>

const CHANNEL_ID = "3509434";

const latestURL =
    `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`;

const historyURL =
    `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=30`;


async function updateDashboard() {

    try {

        const latestResponse = await fetch(latestURL);
        const latest = await latestResponse.json();

        const distance = parseFloat(latest.field1);
        const percent = parseFloat(latest.field2);
        const pump = latest.field3;
        const lora = latest.field4;

        document.getElementById("distance").textContent =
            isNaN(distance) ? "--" : distance.toFixed(1);

        document.getElementById("percent").textContent =
            isNaN(percent) ? "--" : Math.round(percent);

        const pumpElement = document.getElementById("pump");

        if (pump === "1") {
            pumpElement.textContent = "🟢 ON";
            pumpElement.className = "status on";
        } else {
            pumpElement.textContent = "🔴 OFF";
            pumpElement.className = "status off";
        }

        const loraElement = document.getElementById("lora");

        if (lora === "1") {
            loraElement.textContent = "🟢 Connected";
            loraElement.className = "status connected";
        } else {
            loraElement.textContent = "🔴 Lost";
            loraElement.className = "status disconnected";
        }

        document.getElementById("error").textContent = "";

        await drawChart();

    } catch (error) {

        document.getElementById("error").textContent =
            "Unable to connect to ThingSpeak";

    }
}


async function drawChart() {

    const response = await fetch(historyURL);
    const data = await response.json();

    const feeds = data.feeds;

    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    const dpr = window.devicePixelRatio || 1;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.scale(dpr, dpr);

    ctx.clearRect(0, 0, width, height);

    const values = feeds
        .map(feed => parseFloat(feed.field1))
        .filter(value => !isNaN(value));

    if (values.length < 2) {
        ctx.font = "16px Arial";
        ctx.fillText("Waiting for data...", 20, 40);
        return;
    }

    const min = Math.min(...values);
    const max = Math.max(...values);

    const padding = 30;

    const chartWidth = width - padding * 2;
    const chartHeight = height - padding * 2;

    ctx.beginPath();

    values.forEach((value, index) => {

        const x =
            padding +
            (index / (values.length - 1)) * chartWidth;

        const range = max - min || 1;

        const y =
            padding +
            (1 - (value - min) / range) * chartHeight;

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }

    });

    ctx.lineWidth = 3;
    ctx.strokeStyle = "#22d3ee";
    ctx.stroke();

}


updateDashboard();

setInterval(updateDashboard, 20000);

window.addEventListener("resize", drawChart);

</script>

</body>
</html>
