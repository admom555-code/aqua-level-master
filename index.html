<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aqua Level Master</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b1118;
    color: white;
}

.header {
    text-align: center;
    padding: 25px 15px 15px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 2px;
}

.header p {
    margin: 8px 0 0;
    color: #9aa7b5;
    font-size: 15px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.card {
    background: #151e28;
    border: 1px solid #263442;
    border-radius: 18px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.card-title {
    color: #8e9aaa;
    font-size: 14px;
    margin-bottom: 10px;
}

.value {
    font-size: 32px;
    font-weight: bold;
}

.unit {
    font-size: 15px;
    color: #8e9aaa;
}

.green {
    color: #32e875;
}

.red {
    color: #ff4d5a;
}

.blue {
    color: #35b7ff;
}

.cyan {
    color: #31e7e7;
}

.status {
    display: inline-block;
    margin-top: 8px;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    background: #202b37;
}

.chart-card {
    margin-top: 18px;
    background: #151e28;
    border: 1px solid #263442;
    border-radius: 18px;
    padding: 20px;
}

.chart-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

canvas {
    width: 100%;
    height: 280px;
}

.footer {
    text-align: center;
    color: #687686;
    font-size: 13px;
    padding: 20px;
}

@media (max-width: 800px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .value {
        font-size: 27px;
    }
}

@media (max-width: 480px) {
    .header h1 {
        font-size: 24px;
    }

    .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .card {
        padding: 18px 10px;
    }

    .value {
        font-size: 25px;
    }

    canvas {
        height: 220px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>💧 AQUA LEVEL MASTER</h1>
    <p>Remote Water Tank Monitoring System</p>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">WATER LEVEL</div>
            <div class="value cyan" id="level">--</div>
            <div class="unit">cm</div>
        </div>

        <div class="card">
            <div class="card-title">TANK LEVEL</div>
            <div class="value blue" id="percent">--</div>
            <div class="unit">%</div>
        </div>

        <div class="card">
            <div class="card-title">PUMP</div>
            <div class="value" id="pump">--</div>
            <div class="status" id="pumpStatus">Waiting...</div>
        </div>

        <div class="card">
            <div class="card-title">LORA</div>
            <div class="value" id="lora">--</div>
            <div class="status" id="loraStatus">Waiting...</div>
        </div>

    </div>

    <div class="chart-card">
        <div class="chart-title">📈 WATER LEVEL HISTORY</div>
        <canvas id="chart"></canvas>
    </div>

    <div class="footer">
        Last update: <span id="lastUpdate">Waiting...</span>
        <br><br>
        Auto refresh: 20 seconds
    </div>

</div>

<script>

const CHANNEL_ID = "3509434";

const latestURL =
    `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`;

const historyURL =
    `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=30`;


// -----------------------------
// LOAD LATEST DATA
// -----------------------------

async function loadLatest() {

    try {

        const response = await fetch(latestURL + "&_=" + Date.now());

        const data = await response.json();

        const level = parseFloat(data.field1);
        const percent = parseFloat(data.field2);
        const pump = data.field3;
        const lora = data.field4;

        if (!isNaN(level)) {
            document.getElementById("level").textContent =
                level.toFixed(1);
        }

        if (!isNaN(percent)) {
            document.getElementById("percent").textContent =
                percent.toFixed(0);
        }

        // Pump
        const pumpElement = document.getElementById("pump");
        const pumpStatus = document.getElementById("pumpStatus");

        if (pump === "1") {

            pumpElement.textContent = "ON";
            pumpElement.className = "value green";

            pumpStatus.textContent = "🟢 RUNNING";
            pumpStatus.className = "status green";

        } else {

            pumpElement.textContent = "OFF";
            pumpElement.className = "value red";

            pumpStatus.textContent = "🔴 STOPPED";
            pumpStatus.className = "status red";
        }

        // LoRa
        const loraElement = document.getElementById("lora");
        const loraStatus = document.getElementById("loraStatus");

        if (lora === "1") {

            loraElement.textContent = "OK";
            loraElement.className = "value green";

            loraStatus.textContent = "🟢 Connected";
            loraStatus.className = "status green";

        } else {

            loraElement.textContent = "LOST";
            loraElement.className = "value red";

            loraStatus.textContent = "🔴 No Signal";
            loraStatus.className = "status red";
        }

        // Last update
        const date = new Date(data.created_at);

        document.getElementById("lastUpdate").textContent =
            date.toLocaleString();

    }

    catch (error) {

        console.log("Latest data error:", error);

    }
}


// -----------------------------
// LOAD HISTORY
// -----------------------------

async function loadHistory() {

    try {

        const response = await fetch(historyURL + "&_=" + Date.now());

        const data = await response.json();

        drawChart(data.feeds);

    }

    catch (error) {

        console.log("History error:", error);

    }
}


// -----------------------------
// DRAW CHART
// -----------------------------

function drawChart(feeds) {

    const canvas = document.getElementById("chart");

    const ctx = canvas.getContext("2d");

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    const dpr = window.devicePixelRatio || 1;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.scale(dpr, dpr);

    ctx.clearRect(0, 0, width, height);

    const values = feeds
        .map(feed => parseFloat(feed.field1))
        .filter(value => !isNaN(value));

    if (values.length < 2) {

        ctx.fillStyle = "#8e9aaa";
        ctx.font = "16px Arial";
        ctx.fillText("Waiting for history...", 20, 40);

        return;
    }

    const padding = 35;

    const chartWidth = width - padding * 2;
    const chartHeight = height - padding * 2;

    const minValue = Math.min(...values);
    const maxValue = Math.max(...values);

    const range = Math.max(maxValue - minValue, 10);

    // Grid
    ctx.strokeStyle = "#263442";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 4; i++) {

        const y =
            padding + (chartHeight / 4) * i;

        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(width - padding, y);
        ctx.stroke();
    }

    // Line
    ctx.beginPath();

    values.forEach((value, index) => {

        const x =
            padding +
            (index / (values.length - 1)) *
            chartWidth;

        const y =
            padding +
            chartHeight -
            ((value - minValue) / range) *
            chartHeight;

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }

    });

    ctx.strokeStyle = "#31e7e7";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Points
    values.forEach((value, index) => {

        const x =
            padding +
            (index / (values.length - 1)) *
            chartWidth;

        const y =
            padding +
            chartHeight -
            ((value - minValue) / range) *
            chartHeight;

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);

        ctx.fillStyle = "#31e7e7";

        ctx.fill();

    });

    // Labels
    ctx.fillStyle = "#8e9aaa";
    ctx.font = "12px Arial";

    ctx.fillText(
        maxValue.toFixed(1) + " cm",
        5,
        padding
    );

    ctx.fillText(
        minValue.toFixed(1) + " cm",
        5,
        height - padding
    );
}


// -----------------------------
// START
// -----------------------------

async function updateDashboard() {

    await loadLatest();

    await loadHistory();

}

updateDashboard();

setInterval(updateDashboard, 20000);

</script>

</body>
</html>
